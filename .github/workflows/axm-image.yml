name: axm-image

on:
  pull_request:
    branches: ['axm/**']
  push:
    tags: ['v*-axm.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize reruns of a release so the second run sees the published tag.
# Only superseded PR runs are cancelled (a new push makes the older run moot);
# tag (release) and manual runs are never cancelled.
concurrency:
  group: axm-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: listmonk
          POSTGRES_PASSWORD: listmonk-ci
          POSTGRES_DB: listmonk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U listmonk"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history is only needed to check a release tag belongs to
          # origin/axm/*; PR runs only build the merge commit.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Resolve and validate version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-axm\.[1-9][0-9]*$ ]] || exit 1
            git fetch origin '+refs/heads/axm/*:refs/remotes/origin/axm/*'
            branches=$(git for-each-ref --format='%(refname)' --contains HEAD refs/remotes/origin/axm/)
            test -n "$branches" || { echo 'Release commit must belong to origin/axm/*'; exit 1; }
            version="$REF_NAME"
            publish=true
          else
            version="v6.2.0-axm.0-pr${PR_NUMBER:-manual}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Reject an already published release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          credentials = base64.b64encode(f"{os.environ['GITHUB_ACTOR']}:{os.environ['GH_TOKEN']}".encode()).decode()
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:aegislab-dev/listmonk:pull'})
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + credentials})
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['token']
          request = urllib.request.Request('https://ghcr.io/v2/aegislab-dev/listmonk/manifests/' + os.environ['VERSION'], method='HEAD', headers={
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json',
          })
          try:
              urllib.request.urlopen(request).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Release tag exists; increment axm.N instead of publishing again')
          PY

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run Go unit and dynamic-list database tests
        env:
          AXM_TEST_DB_URL: postgres://listmonk:listmonk-ci@127.0.0.1:5432/listmonk_dynamic_tests?sslmode=disable
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} createdb -U listmonk listmonk_dynamic_tests
          go test ./... -timeout 180s

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build packed image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.axm
          platforms: linux/amd64
          load: true
          push: false
          tags: listmonk-axm:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/aegislab-dev/listmonk
            org.opencontainers.image.url=https://github.com/aegislab-dev/listmonk/tree/${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.title=listmonk (AXM fork)
            org.opencontainers.image.description=Modified version of knadh/listmonk with AXM frontend changes
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install and smoke test packed image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LISTMONK_db__host: 127.0.0.1
          LISTMONK_db__port: '5432'
          LISTMONK_db__user: listmonk
          LISTMONK_db__password: listmonk-ci
          LISTMONK_db__database: listmonk
          LISTMONK_db__ssl_mode: disable
          LISTMONK_app__address: 0.0.0.0:9000
          LISTMONK_ADMIN_USER: ci-admin
          LISTMONK_ADMIN_PASSWORD: ci-only-password
        run: |
          set -euo pipefail
          actual=$(docker run --rm --entrypoint ./listmonk listmonk-axm:ci --version)
          [[ "$actual" == "$VERSION ("* ]]
          docker run --rm --entrypoint sh listmonk-axm:ci -c 'test -s LICENSE && test -s FORK.md'
          env_args=()
          while IFS='=' read -r key _; do
            if [[ "$key" == LISTMONK_* ]]; then
              env_args+=(-e "$key")
            fi
          done < <(env)
          docker run --rm --network host "${env_args[@]}" listmonk-axm:ci ./listmonk --install --idempotent --yes
          count=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT count(*) FROM settings WHERE key = 'axm.business_footer' AND value->'enabled' = 'false'::jsonb")
          test "$count" = 1
          sends=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'axm_campaign_sends')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE tablename = 'axm_campaign_sends')::text")
          test "$sends" = 13:3
          draws=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename IN ('axm_list_draws', 'axm_list_draw_campaigns'))::text || ':' || (SELECT count(*) FROM pg_proc WHERE proname IN ('axm_list_target', 'axm_draw_candidates')) || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_propagate_draw_unsub', 'axm_keep_draw_campaigns', 'axm_guard_exclude_list_delete') AND NOT tgisinternal)")
          test "$draws" = 2:2:3
          teams=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'roles' AND column_name IN ('axm_team_tag', 'axm_team_user_role_id'))::text || ':' || (SELECT count(*) FROM pg_proc WHERE proname IN ('axm_sync_team_lists', 'axm_team_lists_trigger', 'axm_team_role_trigger'))::text || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_team_lists_sync', 'axm_team_role_sync') AND NOT tgisinternal)::text")
          test "$teams" = 2:3:2
          suppress=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename = 'axm_suppressed_emails')::text || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_suppress_new_subscriber', 'axm_suppress_changed_email', 'axm_unsubscribe_blocked_email', 'axm_track_blocklist_ins', 'axm_track_blocklist_upd', 'axm_keep_blocklist', 'axm_block_subscription') AND NOT tgisinternal)::text")
          test "$suppress" = 1:7
          audit=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'axm_audit_log')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE tablename = 'axm_audit_log')::text || ':' || (SELECT count(*) FROM pg_tables WHERE tablename IN ('axm_deleted_lists', 'axm_deleted_list_subs'))::text")
          test "$audit" = 12:5:2
          presets=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename = 'axm_column_presets')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE indexname = 'idx_axm_column_presets_name')::text")
          test "$presets" = 1:1
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U listmonk -d listmonk < frontend/cypress/fixtures/reaction-lists.sql
          # A test inbox, so that browser tests can check who a campaign really reached (LST-48).
          docker run -d --name axm-mail --network host -e MP_SMTP_BIND_ADDR=127.0.0.1:1025 -e MP_UI_BIND_ADDR=127.0.0.1:8025 axllent/mailpit:v1.27
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U listmonk -d listmonk -c "UPDATE settings SET value = jsonb_build_array(jsonb_set(jsonb_set(jsonb_set(jsonb_set(jsonb_set(value->0, '{host}', '\"127.0.0.1\"'), '{port}', '1025'), '{auth_protocol}', '\"none\"'), '{tls_type}', '\"none\"'), '{enabled}', 'true')) WHERE key = 'smtp'"
          docker run -d --name axm-smoke --network host "${env_args[@]}" listmonk-axm:ci
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:9000/health
          python3 - <<'PY'
          import html, http.cookiejar, json, os, re, urllib.parse, urllib.request
          root = 'http://127.0.0.1:9000'
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def get(path):
              with client.open(root + path) as response:
                  assert response.status == 200
                  return response.read().decode()
          login = get('/admin/login')
          assert 'github.com/aegislab-dev/listmonk' in login
          nonce = html.unescape(re.search(r'name="nonce" value="([^"]+)"', login)[1])
          data = urllib.parse.urlencode({'username': os.environ['LISTMONK_ADMIN_USER'], 'password': os.environ['LISTMONK_ADMIN_PASSWORD'], 'nonce': nonce, 'next': '/admin/'}).encode()
          with client.open(root + '/admin/login', data=data) as response:
              assert response.status == 200
          assert json.loads(get('/api/config'))['data']['version'] == os.environ['VERSION']
          settings = json.loads(get('/api/settings'))['data']
          assert settings['axm.sender_domains'] == []
          assert settings['axm.default_from'] == settings['axm.default_reply_to'] == ''
          footer = settings['axm.business_footer']
          assert footer['enabled'] is False and footer['company_name'] == ''
          # Fetch the actual embedded Vue entry bundle, not a source file.
          admin = get('/admin/')
          scripts = re.findall(r'<script[^>]+src="([^"]+\.js)"', admin)
          assert scripts, 'Missing packed admin bundle'
          bundles = [get(path) for path in scripts]
          assert any('github.com/aegislab-dev/listmonk' in bundle and 'source-footer' in bundle for bundle in bundles)
          PY

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'

      - name: Browser import and sender tests
        env:
          CYPRESS_LISTMONK_ADMIN_USER: ci-admin
          CYPRESS_LISTMONK_ADMIN_PASSWORD: ci-only-password
          CYPRESS_mailpitUrl: http://127.0.0.1:8025
        run: |
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile
          for tz in Asia/Seoul America/New_York Pacific/Auckland; do TZ=$tz node --test tests/schedule-time.test.mjs; done
          npx cypress run --browser chrome --spec 'cypress/e2e/import-mapping.cy.js,cypress/e2e/sender-addresses.cy.js,cypress/e2e/from-addresses.cy.js,cypress/e2e/dynamic-lists.cy.js,cypress/e2e/list-draw.cy.js,cypress/e2e/list-teams.cy.js,cypress/e2e/reaction-lists.cy.js,cypress/e2e/subscriber-columns.cy.js,cypress/e2e/column-presets.cy.js,cypress/e2e/audit.cy.js,cypress/e2e/list-trash.cy.js,cypress/e2e/campaign-recent-exclude.cy.js,cypress/e2e/campaign-tracking-check.cy.js,cypress/e2e/analytics-proof.cy.js,cypress/e2e/address-check.cy.js,cypress/e2e/campaign-test-send.cy.js,cypress/e2e/schedule-time.cy.js,cypress/e2e/campaign-send-confirm.cy.js'

      - name: Upgrade official v6.2.0 database and smoke test
        env:
          LISTMONK_db__host: 127.0.0.1
          LISTMONK_db__port: '5432'
          LISTMONK_db__user: listmonk
          LISTMONK_db__password: listmonk-ci
          LISTMONK_db__database: listmonk_upgrade
          LISTMONK_db__ssl_mode: disable
          LISTMONK_app__address: 0.0.0.0:9001
          LISTMONK_ADMIN_USER: ci-admin
          LISTMONK_ADMIN_PASSWORD: ci-only-password
        run: |
          set -euo pipefail
          docker exec ${{ job.services.postgres.id }} createdb -U listmonk listmonk_upgrade
          env_args=()
          while IFS='=' read -r key _; do
            if [[ "$key" == LISTMONK_* ]]; then
              env_args+=(-e "$key")
            fi
          done < <(env)
          docker run --rm --network host "${env_args[@]}" listmonk/listmonk:v6.2.0 ./listmonk --install --idempotent --yes
          docker run --rm --network host "${env_args[@]}" listmonk-axm:ci ./listmonk --upgrade --yes
          docker run --rm --network host "${env_args[@]}" listmonk-axm:ci ./listmonk --upgrade --yes
          count=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT count(*) FROM settings WHERE key = 'axm.business_footer' AND value->'enabled' = 'false'::jsonb")
          test "$count" = 1
          migration=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT value->>-1 FROM settings WHERE key = 'migrations'")
          test "$migration" = v6.2.1-axm.15
          test_domains=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT value::text FROM settings WHERE key = 'axm.test_domains'")
          test "$test_domains" = '[]'
          test_addr=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'axm_test_addresses')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE tablename = 'axm_test_addresses')::text")
          test "$test_addr" = 6:2
          sends=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'axm_campaign_sends')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE tablename = 'axm_campaign_sends')::text")
          test "$sends" = 13:3
          draws=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename IN ('axm_list_draws', 'axm_list_draw_campaigns'))::text || ':' || (SELECT count(*) FROM pg_proc WHERE proname IN ('axm_list_target', 'axm_draw_candidates')) || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_propagate_draw_unsub', 'axm_keep_draw_campaigns', 'axm_guard_exclude_list_delete') AND NOT tgisinternal)")
          test "$draws" = 2:2:3
          teams=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'roles' AND column_name IN ('axm_team_tag', 'axm_team_user_role_id'))::text || ':' || (SELECT count(*) FROM pg_proc WHERE proname IN ('axm_sync_team_lists', 'axm_team_lists_trigger', 'axm_team_role_trigger'))::text || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_team_lists_sync', 'axm_team_role_sync') AND NOT tgisinternal)::text")
          test "$teams" = 2:3:2
          suppress=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename = 'axm_suppressed_emails')::text || ':' || (SELECT count(*) FROM pg_trigger WHERE tgname IN ('axm_suppress_new_subscriber', 'axm_suppress_changed_email', 'axm_unsubscribe_blocked_email', 'axm_track_blocklist_ins', 'axm_track_blocklist_upd', 'axm_keep_blocklist', 'axm_block_subscription') AND NOT tgisinternal)::text")
          test "$suppress" = 1:7
          audit=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_name = 'axm_audit_log')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE tablename = 'axm_audit_log')::text || ':' || (SELECT count(*) FROM pg_tables WHERE tablename IN ('axm_deleted_lists', 'axm_deleted_list_subs'))::text")
          test "$audit" = 12:5:2
          presets=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT (SELECT count(*) FROM pg_tables WHERE tablename = 'axm_column_presets')::text || ':' || (SELECT count(*) FROM pg_indexes WHERE indexname = 'idx_axm_column_presets_name')::text")
          test "$presets" = 1:1
          number=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT axm_to_number('\" 100,000 \"'::jsonb)::text || ':' || (axm_to_number('\"100,000원\"'::jsonb) IS NULL)::text")
          test "$number" = 100000:true
          column=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name = 'lists' AND column_name = 'axm_filter'")
          test "$column" = 1
          trigger=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT count(*) FROM pg_trigger WHERE tgname = 'axm_guard_dynamic_subscription' AND NOT tgisinternal")
          test "$trigger" = 1
          # Lists that existed before the upgrade get the default column preset.
          presets=$(docker exec ${{ job.services.postgres.id }} psql -U listmonk -d listmonk_upgrade -Atc "SELECT count(*) || ':' || count(*) FILTER (WHERE axm_preset = 'creator') FROM lists")
          test "$presets" = 2:2
          trap 'docker logs axm-upgrade-smoke; docker rm -f axm-upgrade-smoke' EXIT
          docker run -d --name axm-upgrade-smoke --network host "${env_args[@]}" listmonk-axm:ci
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:9001/health

      - name: Login to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_TAG: ${{ steps.version.outputs.sha_tag }}
        run: |
          set -euo pipefail
          image=ghcr.io/aegislab-dev/listmonk
          docker tag listmonk-axm:ci "$image:$VERSION"
          docker tag listmonk-axm:ci "$image:$SHA_TAG"
          docker push "$image:$VERSION" | tee "$RUNNER_TEMP/axm-push.log"
          docker push "$image:$SHA_TAG"
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p' "$RUNNER_TEMP/axm-push.log")
          test -n "$digest"
          {
            echo "Published: $image:$VERSION"
            echo "Digest: $image@$digest"
            echo "Source: https://github.com/aegislab-dev/listmonk/tree/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke container logs and cleanup
        if: always()
        run: |
          docker logs axm-smoke || true
          docker rm -f axm-smoke || true
          docker rm -f axm-mail || true
